[package]
name = "torxel_engine"
version = "0.0.1"
edition = "2021"
resolver = "2"

[dependencies]
# Core engine
bevy = { version = "0.19.1" }

# Сериализация сохранений
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dirs = "5.0" # Для определения пути к сохранениям (Win/Linux/Mac)

# Процедурная генерация
noise = "0.9"
rand = "0.10"
rand_chacha = "0.10"

# Векторная математика (уже есть в Bevy, но явно укажем для удобства)
glam = "0.33.7"

# Физика твёрдых тел (Avian3D для RigidBody, ConvexHull, коллизий)
# Будет использоваться в v2 для физических объектов поверх вокселей
avian3d = "0.7"

# Профилирование (опционально, можно включить позже)
# tracing = "0.1"
# tracing-subscriber = "0.3"


# Dev профиль: быстрая компиляция для итераций
[profile.dev]
opt-level = 1 # Немного оптимизируем, чтобы тесты летали
split-debuginfo = "packed"

# Dev с флагами беви (для динамической линковки)
[profile.dev.package."*"]
opt-level = 3

# Release профиль: МАКСИМАЛЬНАЯ производительность
[profile.release]
opt-level = 3
lto = "thin"       # Link Time Optimization (сквозная оптимизация)
codegen-units = 1  # Максимальная оптимизация кода (долгая сборка)
panic = "abort"    # Меньше размер бинарника, быстрее краш (без unwind)